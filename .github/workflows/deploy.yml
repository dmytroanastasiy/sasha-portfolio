name: Deploy to GitHub Pages

on:
  # Runs every time you push to main — change the branch name below if yours differs
  push:
    branches: [main]
  # Lets you also trigger a deploy manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
